name: Update WisdomAI feed
on:
  schedule:
    - cron: "17 * * * *"     # hourly at :17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate feed
        run: python wisdomai_feed.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh WisdomAI feed $(date -u +%FT%TZ)"
            git push
          fi
